services:
  - type: web
    name: clipdrop
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT app:app
    envVars:
      - key: MAX_DOWNLOAD_MB
        value: "100"
      - key: MAX_DURATION_SECONDS
        value: "900"
      - key: MAX_CONCURRENT
        value: "1"
